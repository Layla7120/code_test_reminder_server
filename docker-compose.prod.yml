## 부하 테스트용 단일 EC2 배포 (c5.large 스팟 인스턴스 권장)
##
## 사용법:
##   docker compose -f docker-compose.prod.yml up -d
##   docker compose -f docker-compose.prod.yml --profile flask up -d    # Flask 포함
##   docker compose -f docker-compose.prod.yml --profile spring up -d   # Spring Boot 포함
##
## 테스트 순서:
##   1. Flask 서버만 올리고 k6_flask.js 실행
##   2. Flask 내리고 Spring Boot 올리고 k6_spring.js 실행
##   3. 결과 JSON 로컬로 복사 후 EC2 terminate

services:
  mysql:
    image: mysql:8.0
    container_name: reminder-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: reminder
      MYSQL_USER: ${DB_USER:-reminder}
      MYSQL_PASSWORD: ${DB_PASSWORD:-reminder}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    container_name: reminder-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Flask 서버 ──────────────────────────────────────────────
  # k6 run -e BASE_URL=http://localhost:5000 k6/k6_flask.js
  flask:
    profiles: ["flask"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reminder-flask
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-reminder}
      DB_PASSWORD: ${DB_PASSWORD:-reminder}
      DB_NAME: reminder
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      SQLALCHEMY_POOL_SIZE: 20          # Flask tuned 조건
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy

  # ── Spring Boot 서버 ────────────────────────────────────────
  # k6 run -e BASE_URL=http://localhost:8080 k6/k6_spring.js
  spring:
    profiles: ["spring"]
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: reminder-spring
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-reminder}
      DB_PASSWORD: ${DB_PASSWORD:-reminder}
      DB_NAME: reminder
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql-data:
