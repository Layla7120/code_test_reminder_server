services:
  mysql:
    image: mysql:8.0
    container_name: reminder-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: reminder
      MYSQL_USER: reminder
      MYSQL_PASSWORD: reminder
    ports:
      - "3306:3306"
    volumes:
      # 스키마는 앱 기동 시 Flyway 가 만든다 (server/src/main/resources/db/migration).
      # init.sql 마운트를 지운 이유: 볼륨 최초 생성 때만 실행되어 이후 스키마 변경이
      # 조용히 누락됐다 — PLAN-db-foundation.md Phase 0.
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql-data:
