name: test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Testcontainers가 실제 MySQL·Redis를 띄운다.
      # ubuntu-latest 러너에는 Docker가 이미 올라와 있어 별도 서비스 설정이 필요 없다.
      # 스키마는 infra/init.sql 원본을 그대로 물리므로(build.gradle.kts 의 schema.init.sql),
      # 엔티티와 스키마가 어긋나면 여기서 잡힌다.
      - name: Run tests
        working-directory: server
        run: ./gradlew test

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: server/build/reports/tests/test/
          retention-days: 7
