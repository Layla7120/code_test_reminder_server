spring:
  application:
    name: reminder-server

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:reminder}?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20       # Flask tuned 시나리오와 동일 조건 (k6 비교용)
      minimum-idle: 5
      connection-timeout: 3000        # Fail-fast: 3초 초과 시 즉시 5xx 반환 (대기열 붕괴 방지)
      idle-timeout: 600000
      max-lifetime: 1800000       # Flask pool_recycle=1800s 와 동일

  jpa:
    hibernate:
      ddl-auto: validate          # 엔티티-스키마 불일치 시 즉시 실패 (운영 안전)
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    # 스키마의 진실 원천: db/migration (규칙은 PLAN-db-foundation.md §3).
    # baseline-on-migrate: flyway_schema_history 가 없는 기존 DB(구 init.sql 로 만든 볼륨)를
    # "V1 과 같다"고 선언하고 V1 을 건너뛴다. 선언일 뿐 검증이 아니다 —
    # 컬럼 수준 검증은 위 ddl-auto: validate 가 한다 (Flyway 실행 후 JPA 가 뜬다).
    # 빈 DB 에는 V1 부터 전부 적용한다.
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis
    redis:
      time-to-live: 60000         # 60초 (Flask CACHE_TIMEOUT 동일)

server:
  port: ${PORT:8080}

github:
  token: ${GITHUB_TOKEN}

# 주소를 Flask 시절과 같게 맞춘다 (app/__init__.py 의 OPENAPI_URL_PREFIX=/docs +
# OPENAPI_SWAGGER_UI_PATH=/swagger-ui → /docs/swagger-ui). 복구가 목적이라 경로도 그대로 둔다.
springdoc:
  api-docs:
    path: /docs/openapi.json
  swagger-ui:
    path: /docs/swagger-ui
