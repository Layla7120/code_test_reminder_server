spring:
  application:
    name: reminder-server

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:reminder}?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20       # Flask tuned 시나리오와 동일 조건 (k6 비교용)
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000       # Flask pool_recycle=1800s 와 동일

  jpa:
    hibernate:
      ddl-auto: validate          # 엔티티-스키마 불일치 시 즉시 실패 (운영 안전)
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis
    redis:
      time-to-live: 60000         # 60초 (Flask CACHE_TIMEOUT 동일)

server:
  port: ${PORT:8080}

github:
  token: ${GITHUB_TOKEN}
